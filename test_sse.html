<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI 流式对话测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .chat-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      min-height: 300px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }
    .message {
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .user { color: #1a73e8; font-weight: bold; }
    .ai { color: #333; }
    .input-row {
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 14px;
      resize: vertical;
      min-height: 60px;
    }
    button {
      padding: 10px 24px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      align-self: flex-end;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status { color: #666; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>AI 流式对话测试（SSE）</h2>

  <div class="chat-box" id="chatBox">
    <div class="message ai">👋 你好！我是 AI 助手，有什么可以帮你的？</div>
  </div>

  <div class="input-row">
    <textarea id="input" placeholder="输入消息，按发送..." rows="2"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
  <div id="status"></div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    // 支持 Enter 发送，Shift+Enter 换行
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      // 禁用按钮，防止重复发送
      sendBtn.disabled = true;
      input.value = '';
      status.textContent = 'AI 正在思考...';

      // 显示用户消息
      appendMessage('user', `你：${message}`);

      // 创建 AI 回复占位符
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.textContent = 'AI：';
      chatBox.appendChild(aiDiv);

      try {
        // 用 fetch 发 POST 请求，读取流式响应
        const response = await fetch('http://localhost:8000/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        // 用 ReadableStream 读取 SSE 数据
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const jsonStr = line.slice(6);   // 去掉 "data: " 前缀
              try {
                const data = JSON.parse(jsonStr);
                if (data.content === '[DONE]') {
                  status.textContent = '回复完成';
                  break;
                }
                if (data.error) {
                  aiDiv.textContent += `[错误：${data.error}]`;
                  break;
                }
                // 追加文字到 AI 消息框
                aiDiv.textContent += data.content;
                // 滚动到底部
                chatBox.scrollTop = chatBox.scrollHeight;
              } catch (e) {
                // 忽略解析错误
              }
            }
          }
        }
      } catch (err) {
        status.textContent = `请求失败：${err.message}`;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
